# Paper-sim su server: un daemon + una dashboard per simbolo, stato e log nel
# volume `paper_data` (il repo sul server resta pulito). Avvio:
#
#     docker compose -f docker-compose.paper.yml up -d --build
#
# Le dashboard sono pubblicate SOLO su 127.0.0.1 del server: dal Mac
#     ssh -N -L 8765:localhost:8765 -L 8766:localhost:8766 \
#            -L 8767:localhost:8767 -L 8768:localhost:8768 <vps>
# oppure Tailscale (vedi deploy/vps.md). Per aggiungere un simbolo, copia la
# coppia di servizi cambiando SYMBOL, percorsi /data/<SLUG> e porta host.
#
# NB: `environment` non si fonde con gli anchor YAML (vince il blocco del
# servizio), quindi TZ/DASHBOARD_HOST vanno ripetuti in ogni servizio.

x-daemon: &daemon
  build:
    context: .
    dockerfile: Dockerfile.live
  image: tradingagents-paper
  env_file: .env.live
  restart: unless-stopped
  command: ["python", "-m", "paper_sim.run"]
  volumes:
    - paper_data:/data

x-dashboard: &dashboard
  image: tradingagents-paper
  env_file: .env.live
  restart: unless-stopped
  command: ["python", "-m", "paper_sim.dashboard"]
  volumes:
    - paper_data:/data

services:
  sol:
    <<: *daemon
    environment:
      TZ: Europe/Rome
      SYMBOL: PF_SOLUSD
      PAPER_STATE_PATH: /data/SOL/state.json
      PAPER_LOG_DIR: /data/SOL/logs

  sol-dashboard:
    <<: *dashboard
    environment:
      TZ: Europe/Rome
      DASHBOARD_HOST: 0.0.0.0
      SYMBOL: PF_SOLUSD
      PAPER_STATE_PATH: /data/SOL/state.json
      PAPER_LOG_DIR: /data/SOL/logs
    ports:
      - "127.0.0.1:8765:8765"
    depends_on:
      - sol

  ada:
    <<: *daemon
    environment:
      TZ: Europe/Rome
      SYMBOL: PF_ADAUSD
      PAPER_STATE_PATH: /data/ADA/state.json
      PAPER_LOG_DIR: /data/ADA/logs

  ada-dashboard:
    <<: *dashboard
    environment:
      TZ: Europe/Rome
      DASHBOARD_HOST: 0.0.0.0
      SYMBOL: PF_ADAUSD
      PAPER_STATE_PATH: /data/ADA/state.json
      PAPER_LOG_DIR: /data/ADA/logs
    ports:
      - "127.0.0.1:8766:8765"
    depends_on:
      - ada

  btc:
    <<: *daemon
    environment:
      TZ: Europe/Rome
      SYMBOL: PF_XBTUSD
      PAPER_STATE_PATH: /data/BTC/state.json
      PAPER_LOG_DIR: /data/BTC/logs

  btc-dashboard:
    <<: *dashboard
    environment:
      TZ: Europe/Rome
      DASHBOARD_HOST: 0.0.0.0
      SYMBOL: PF_XBTUSD
      PAPER_STATE_PATH: /data/BTC/state.json
      PAPER_LOG_DIR: /data/BTC/logs
    ports:
      - "127.0.0.1:8767:8765"
    depends_on:
      - btc

  hype:
    <<: *daemon
    environment:
      TZ: Europe/Rome
      SYMBOL: PF_HYPEUSD
      PAPER_STATE_PATH: /data/HYPE/state.json
      PAPER_LOG_DIR: /data/HYPE/logs

  hype-dashboard:
    <<: *dashboard
    environment:
      TZ: Europe/Rome
      DASHBOARD_HOST: 0.0.0.0
      SYMBOL: PF_HYPEUSD
      PAPER_STATE_PATH: /data/HYPE/state.json
      PAPER_LOG_DIR: /data/HYPE/logs
    ports:
      - "127.0.0.1:8768:8765"
    depends_on:
      - hype

  # --- profilo "tuned": stessi simboli di sol/hype ma con i fix di rischio
  # attivi (A/B test contro il profilo aggressivo, che resta invariato).
  sol-tuned:
    <<: *daemon
    environment: &tuned-sol-env
      TZ: Europe/Rome
      SYMBOL: PF_SOLUSD
      PAPER_STATE_PATH: /data/SOL_TUNED/state.json
      PAPER_LOG_DIR: /data/SOL_TUNED/logs
      STOP_ATR_MULT: "2.0"
      TAKE_PROFIT_RR: "2.0"
      RISK_PCT_PER_TRADE: "2"
      MIN_TP_COST_MULT: "4"
      TIME_STOP_HOURS: "6"
      REGIME_PERSIST_TICKS: "3"
      REGIME_EXIT_CHECK: "1"
      MIN_ANALYST_RR: "1.5"

  sol-tuned-dashboard:
    <<: *dashboard
    environment:
      <<: *tuned-sol-env
      DASHBOARD_HOST: 0.0.0.0
      DASHBOARD_LABEL: SOL-TUNED
    ports:
      - "127.0.0.1:8769:8765"
    depends_on:
      - sol-tuned

  hype-tuned:
    <<: *daemon
    environment: &tuned-hype-env
      TZ: Europe/Rome
      SYMBOL: PF_HYPEUSD
      PAPER_STATE_PATH: /data/HYPE_TUNED/state.json
      PAPER_LOG_DIR: /data/HYPE_TUNED/logs
      STOP_ATR_MULT: "2.0"
      TAKE_PROFIT_RR: "2.0"
      RISK_PCT_PER_TRADE: "2"
      MIN_TP_COST_MULT: "4"
      TIME_STOP_HOURS: "6"
      REGIME_PERSIST_TICKS: "3"
      REGIME_EXIT_CHECK: "1"
      MIN_ANALYST_RR: "1.5"

  hype-tuned-dashboard:
    <<: *dashboard
    environment:
      <<: *tuned-hype-env
      DASHBOARD_HOST: 0.0.0.0
      DASHBOARD_LABEL: HYPE-TUNED
    ports:
      - "127.0.0.1:8770:8765"
    depends_on:
      - hype-tuned

  # --- profilo "struct": tuned + STRUCTURAL_SL (stop a doppio binario dal
  # contratto del PM) + ingressi OCO parcheggiati (ENTRY_MODE=plan) +
  # conditional holds + modelli gpt-5.6 — allineato al setup di Paul per
  # confrontare le run. Le tuned restano il controllo a mercato.
  sol-struct:
    <<: *daemon
    environment: &struct-sol-env
      TZ: Europe/Rome
      SYMBOL: PF_SOLUSD
      PAPER_STATE_PATH: /data/SOL_STRUCT/state.json
      PAPER_LOG_DIR: /data/SOL_STRUCT/logs
      STOP_ATR_MULT: "2.0"
      TAKE_PROFIT_RR: "2.0"
      RISK_PCT_PER_TRADE: "2"
      MIN_TP_COST_MULT: "4"
      TIME_STOP_HOURS: "6"
      REGIME_PERSIST_TICKS: "3"
      REGIME_EXIT_CHECK: "1"
      MIN_ANALYST_RR: "1.5"
      STRUCTURAL_SL: "1"
      ENTRY_MODE: "plan"
      ENTRY_TTL_MIN: "120"
      CONDITIONAL_HOLDS: "1"
      DEEP_MODEL: "gpt-5.6-sol"
      QUICK_MODEL: "gpt-5.6-luna"

  sol-struct-dashboard:
    <<: *dashboard
    environment:
      <<: *struct-sol-env
      DASHBOARD_HOST: 0.0.0.0
      DASHBOARD_LABEL: SOL-STRUCT
    ports:
      - "127.0.0.1:8771:8765"
    depends_on:
      - sol-struct

  hype-struct:
    <<: *daemon
    environment: &struct-hype-env
      TZ: Europe/Rome
      SYMBOL: PF_HYPEUSD
      PAPER_STATE_PATH: /data/HYPE_STRUCT/state.json
      PAPER_LOG_DIR: /data/HYPE_STRUCT/logs
      STOP_ATR_MULT: "2.0"
      TAKE_PROFIT_RR: "2.0"
      RISK_PCT_PER_TRADE: "2"
      MIN_TP_COST_MULT: "4"
      TIME_STOP_HOURS: "6"
      REGIME_PERSIST_TICKS: "3"
      REGIME_EXIT_CHECK: "1"
      MIN_ANALYST_RR: "1.5"
      STRUCTURAL_SL: "1"
      ENTRY_MODE: "plan"
      ENTRY_TTL_MIN: "120"
      CONDITIONAL_HOLDS: "1"
      DEEP_MODEL: "gpt-5.6-sol"
      QUICK_MODEL: "gpt-5.6-luna"

  hype-struct-dashboard:
    <<: *dashboard
    environment:
      <<: *struct-hype-env
      DASHBOARD_HOST: 0.0.0.0
      DASHBOARD_LABEL: HYPE-STRUCT
    ports:
      - "127.0.0.1:8772:8765"
    depends_on:
      - hype-struct

  # Rete host: gli upstream del Caddyfile sono le porte loopback del server
  # (la dashboard paul binda 127.0.0.1 hard e la bridge non la raggiunge).
  # Niente depends_on: caddy non deve resuscitare dashboard ferme.
  caddy:
    image: caddy:2
    restart: unless-stopped
    env_file: .env.live
    network_mode: host
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  paper_data:
  caddy_data:
  caddy_config:
