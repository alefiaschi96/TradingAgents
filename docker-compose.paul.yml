# Run del codice di Paul (branch `paul` @ 4a39cc3) TALE E QUALE sui nostri due
# simboli — sostituisce le run sol-struct/hype-struct per un confronto onesto
# col suo setup. Il codice NON è il branch ale: build da un worktree fratello.
#
# Setup sul server (una tantum, il deploy lo fa da solo):
#   cd /root/TradingAgents
#   git fetch origin paul
#   git worktree add /root/TradingAgents-paul origin/paul
#   cp Dockerfile.live requirements-live.txt /root/TradingAgents-paul/
#     (il branch paul non ha l'infra di deploy: Dockerfile.live e
#      requirements-live.txt vengono presi dal branch ale, il codice no)
#
# Avvio (stesso project name del compose principale, volume condiviso):
#   docker compose -f docker-compose.paper.yml -f docker-compose.paul.yml \
#       up -d --build sol-paul hype-paul sol-paul-dashboard hype-paul-dashboard
#
# Env: .env.live è la base comune (già identica a quella di Paul); qui sotto
# solo i suoi delta. PROFIT_LOCK_PCT=0.3 è la variante a floor fisso presente
# nel suo branch pushato; il suo env di produzione nomina un lock TRAILING
# (PROFIT_LOCK_TRIGGER_PCT/TRAIL_ATR) che NON ha ancora pushato — quando lo
# pusha, si ribuilda e si allinea anche quello.
#
# La sua dashboard binda 127.0.0.1 hardcoded: i servizi dashboard girano in
# network_mode host così bindano il loopback del VPS direttamente (stesse
# porte 8771/8772 dei vecchi struct, i tunnel SSH restano invariati).

x-paul-daemon: &paul-daemon
  build:
    context: /root/TradingAgents-paul
    dockerfile: Dockerfile.live
  image: tradingagents-paper-paul
  env_file: .env.live
  restart: unless-stopped
  command: ["python", "-m", "paper_sim.run"]
  volumes:
    - paper_data:/data

x-paul-dashboard: &paul-dashboard
  image: tradingagents-paper-paul
  env_file: .env.live
  restart: unless-stopped
  command: ["python", "-m", "paper_sim.dashboard"]
  network_mode: host
  volumes:
    - paper_data:/data

x-paul-env: &paul-env
  TZ: Europe/Rome
  DEEP_MODEL: gpt-5.6-sol
  QUICK_MODEL: gpt-5.6-luna
  ENTRY_MODE: plan
  ENTRY_TTL_MIN: "120"
  ENTRY_MAX_STOP_WIDEN: "2.0"
  CONDITIONAL_HOLDS: "false"
  CONDITIONAL_MAX_ATR: "2.0"
  PROFIT_LOCK_PCT: "0.3"

services:
  sol-paul:
    <<: *paul-daemon
    environment:
      <<: *paul-env
      SYMBOL: PF_SOLUSD
      PAPER_STATE_PATH: /data/SOL_PAUL/state.json
      PAPER_LOG_DIR: /data/SOL_PAUL/logs

  sol-paul-dashboard:
    <<: *paul-dashboard
    environment:
      <<: *paul-env
      SYMBOL: PF_SOLUSD
      PAPER_STATE_PATH: /data/SOL_PAUL/state.json
      PAPER_LOG_DIR: /data/SOL_PAUL/logs
      DASHBOARD_PORT: "8771"
      DASHBOARD_OPEN: "0"
    depends_on:
      - sol-paul

  hype-paul:
    <<: *paul-daemon
    environment:
      <<: *paul-env
      SYMBOL: PF_HYPEUSD
      PAPER_STATE_PATH: /data/HYPE_PAUL/state.json
      PAPER_LOG_DIR: /data/HYPE_PAUL/logs

  hype-paul-dashboard:
    <<: *paul-dashboard
    environment:
      <<: *paul-env
      SYMBOL: PF_HYPEUSD
      PAPER_STATE_PATH: /data/HYPE_PAUL/state.json
      PAPER_LOG_DIR: /data/HYPE_PAUL/logs
      DASHBOARD_PORT: "8772"
      DASHBOARD_OPEN: "0"
    depends_on:
      - hype-paul

volumes:
  paper_data:
