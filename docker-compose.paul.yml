# Run del codice di Paul TALE E QUALE sui nostri due simboli — sostituisce le
# run sol-struct/hype-struct per un confronto onesto col suo setup. Il codice
# NON è il branch ale: è l'albero completo di Paul (commit 4a39cc3 + le sue
# modifiche locali mai pushate, incluso il profit lock trailing), consegnato
# via archivio TradingAgents_con_ingresso.rar e sincronizzato dal Mac in
# /root/TradingAgents-paul (esclusi .git, .venv, log e il SUO .env.live: le
# chiavi restano le nostre via env_file). Il suo albero non ha l'infra di
# deploy: Dockerfile.live e requirements-live.txt vengono copiati dal branch
# ale, il codice no.
#
# Avvio (stesso project name del compose principale, volume condiviso):
#   docker compose -f docker-compose.paper.yml -f docker-compose.paul.yml \
#       up -d --build sol-paul hype-paul sol-paul-dashboard hype-paul-dashboard
#
# Env: .env.live è la base comune (già identica a quella di Paul); qui sotto
# solo i suoi delta, con i valori del suo env di produzione (lock trailing
# armato a 0.3% dal TP, trail 1.0 ATR; breakout fill al touch).
#
# La sua dashboard binda 127.0.0.1 hardcoded: i servizi dashboard girano in
# network_mode host così bindano il loopback del VPS direttamente (stesse
# porte 8771/8772 dei vecchi struct, i tunnel SSH restano invariati).

x-paul-daemon: &paul-daemon
  build:
    context: /root/TradingAgents-paul
    dockerfile: Dockerfile.live
  image: tradingagents-paper-paul
  env_file: .env.live
  restart: unless-stopped
  command: ["python", "-m", "paper_sim.run"]
  volumes:
    - paper_data:/data

x-paul-dashboard: &paul-dashboard
  image: tradingagents-paper-paul
  env_file: .env.live
  restart: unless-stopped
  command: ["python", "-m", "paper_sim.dashboard"]
  network_mode: host
  volumes:
    - paper_data:/data

x-paul-env: &paul-env
  TZ: Europe/Rome
  DEEP_MODEL: gpt-5.6-sol
  QUICK_MODEL: gpt-5.6-luna
  ENTRY_MODE: plan
  ENTRY_TTL_MIN: "120"
  ENTRY_MAX_STOP_WIDEN: "2.0"
  CONDITIONAL_HOLDS: "false"
  CONDITIONAL_MAX_ATR: "2.0"
  BREAKOUT_REQUIRE_CLOSE: "false"
  PROFIT_LOCK_TRIGGER_PCT: "0.3"
  PROFIT_LOCK_TRAIL_ATR: "1.0"

services:
  sol-paul:
    <<: *paul-daemon
    environment:
      <<: *paul-env
      SYMBOL: PF_SOLUSD
      PAPER_STATE_PATH: /data/SOL_PAUL/state.json
      PAPER_LOG_DIR: /data/SOL_PAUL/logs

  sol-paul-dashboard:
    <<: *paul-dashboard
    environment:
      <<: *paul-env
      SYMBOL: PF_SOLUSD
      PAPER_STATE_PATH: /data/SOL_PAUL/state.json
      PAPER_LOG_DIR: /data/SOL_PAUL/logs
      DASHBOARD_PORT: "8771"
      DASHBOARD_OPEN: "0"
    depends_on:
      - sol-paul

  hype-paul:
    <<: *paul-daemon
    environment:
      <<: *paul-env
      SYMBOL: PF_HYPEUSD
      PAPER_STATE_PATH: /data/HYPE_PAUL/state.json
      PAPER_LOG_DIR: /data/HYPE_PAUL/logs

  hype-paul-dashboard:
    <<: *paul-dashboard
    environment:
      <<: *paul-env
      SYMBOL: PF_HYPEUSD
      PAPER_STATE_PATH: /data/HYPE_PAUL/state.json
      PAPER_LOG_DIR: /data/HYPE_PAUL/logs
      DASHBOARD_PORT: "8772"
      DASHBOARD_OPEN: "0"
    depends_on:
      - hype-paul

volumes:
  paper_data:
